<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opello — Your own money, unlocked.</title>
<meta name="description" content="Opello is a cross-border money app for people whose lives span countries. Financial freedom should have no borders. Opello is coming soon.">
<meta name="theme-color" content="#001431">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<link rel="canonical" href="https://opello.co.uk/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Opello">
<meta property="og:title" content="Opello — Your own money, unlocked.">
<meta property="og:description" content="Financial freedom should have no borders. Opello is coming soon.">
<meta property="og:url" content="https://opello.co.uk/">
<meta property="og:image" content="https://opello.co.uk/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/nimbus-sans.woff2" as="font" type="font/woff2" crossorigin>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Opello",
  "url": "https://opello.co.uk/",
  "logo": "https://opello.co.uk/assets/opello-wordmark.svg",
  "slogan": "Your own money, unlocked.",
  "description": "A cross-border money app for people whose lives span countries. Financial freedom should have no borders."
}
</script>
<style>
  @font-face {
    font-family: "Nimbus Sans";
    src: url("assets/fonts/nimbus-sans.woff2") format("woff2");
    font-weight: 300 500;
    font-display: swap;
    font-style: normal;
  }

  :root {
    --peach: #F58851;
    --deep: #001431;
    --clay: #E9E4E0;
    --mid: #005385;
    --rule: rgba(233, 228, 224, 0.16);
    --muted: rgba(233, 228, 224, 0.66);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--deep);
    color: var(--clay);
    font-family: "Nimbus Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  .page {
    position: relative;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 3.2vw, 44px) clamp(20px, 4vw, 56px);
    isolation: isolate;
  }

  /* the mark, bleeding past the right edge */
  .aperture {
    position: absolute;
    z-index: -1;
    top: 50%;
    right: clamp(20px, 4vw, 56px);
    width: min(42vw, 560px);
    aspect-ratio: 1;
    transform: translateY(-50%);
    color: var(--peach);
    pointer-events: none;
  }

  .aperture svg { width: 100%; height: 100%; display: block; }

  .aperture svg {
    animation: settle 1400ms var(--ease) both, breathe 18s var(--ease) 1400ms infinite alternate;
    transform-origin: 50% 50%;
  }

  @keyframes breathe {
    from { transform: rotate(-1.2deg) scale(1); }
    to   { transform: rotate(1.4deg) scale(1.015); }
  }

  @keyframes settle {
    from { opacity: 0; transform: scale(0.965); }
    to   { opacity: 1; transform: scale(1); }
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .wordmark { display: block; width: clamp(96px, 9vw, 128px); color: var(--peach); }
  .wordmark svg { display: block; width: 100%; height: auto; }

  .status {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin: 0;
  }

  .status::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--peach);
    animation: pulse 3.2s var(--ease) infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.28; }
  }

  .hero {
    align-self: end;
    padding-bottom: clamp(32px, 6vh, 72px);
  }

  h1 {
    font-size: clamp(2.7rem, 7vw, 5rem);
    font-weight: 400;
    line-height: 0.94;
    letter-spacing: -0.03em;
    margin: 0;
    max-width: 9ch;
  }

  .lede {
    margin: clamp(22px, 3vh, 32px) 0 0;
    font-size: clamp(0.98rem, 1.15vw, 1.08rem);
    line-height: 1.55;
    color: var(--muted);
    max-width: 34ch;
    text-wrap: pretty;
  }

  footer {
    border-top: 1px solid var(--rule);
    padding-top: 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer a {
    color: var(--clay);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: border-color 180ms var(--ease), color 180ms var(--ease);
  }

  footer a:hover { border-color: var(--peach); color: var(--peach); }

  :focus-visible {
    outline: 2px solid var(--peach);
    outline-offset: 3px;
    border-radius: 2px;
  }

  @media (max-width: 760px) {
    .page { grid-template-rows: auto 1fr auto auto; }
    .aperture {
      position: relative;
      top: auto;
      right: auto;
      transform: none;
      width: min(62vw, 300px);
      margin: 0 auto;
      align-self: center;
      grid-row: 2;
    }
    .hero { grid-row: 3; align-self: start; padding-bottom: clamp(28px, 5vh, 48px); }
    .hero, .lede { max-width: none; }
    footer { grid-row: 4; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status::before, .aperture svg { animation: none; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="aperture" aria-hidden="true">
    {{MARK_SVG}}
  </div>

  <header>
    <a class="wordmark" href="/" aria-label="Opello, home">{{WORDMARK_SVG}}</a>
    <p class="status">Coming soon</p>
  </header>

  <div class="hero">
    <h1>Your own money, unlocked.</h1>
    <p class="lede">Opello is a money app for lives that span countries. Fewer barriers, more possibilities, wherever life takes you.</p>
  </div>

  <footer>
    <span>opello.co.uk</span>
    <span>A cross-border money app</span>
  </footer>
</main>
</body>
</html>
